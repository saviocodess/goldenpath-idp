name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          {
            echo "# ${tag}"
            echo
            echo "Summary of changes:"
            awk -v version="${version}" '
              $0 ~ "^## \\[" version "\\]" { capture=1; next }
              capture == 1 && index($0, "## [") == 1 { exit }
              capture == 1 { print }
            ' CHANGELOG.md
          } > RELEASE_NOTES.md

      - name: Package docs artifact
        run: |
          tar -czf goldenpath-idp-docs-${GITHUB_REF_NAME}.tar.gz \
            docs \
            README.md README.pt-BR.md \
            SECURITY.md SECURITY.pt-BR.md \
            CONTRIBUTING.md CONTRIBUTING.pt-BR.md \
            CHANGELOG.md LICENSE

      - name: Upload docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-${{ github.ref_name }}
          path: goldenpath-idp-docs-${{ github.ref_name }}.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            goldenpath-idp-docs-${{ github.ref_name }}.tar.gz
