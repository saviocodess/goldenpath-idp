apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goldenpath-idp-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saviocodess/goldenpath-idp.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
