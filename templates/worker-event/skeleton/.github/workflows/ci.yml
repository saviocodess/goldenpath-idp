name: template-worker-event-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: template-worker-event-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn_major="$(yarn --version | cut -d. -f1)"
            if [ "${yarn_major}" -ge 2 ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          else
            yarn install
          fi

      - name: Quality checks
        run: yarn verify

      - name: Build
        run: yarn build
